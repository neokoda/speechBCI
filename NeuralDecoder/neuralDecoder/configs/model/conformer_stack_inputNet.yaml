# Model type selector
modelType: conformer

d_model: 512
nhead: 8
num_layers: 4
d_ff: 2048
convKernelSize: 31
posEncType: sinusoidal
dropout: 0.1
attentionDropout: 0.0
gradientCheckpointing: false
specAugment: false
freqMaskParam: 27
timeMaskParam: 10
nFreqMasks: 2
nTimeMasks: 2
squeezeExcitation: false
seNChannels: 256
seReduction: 8
spatialAttention: false
spatialAttnDim: 64
spatialAttnHeads: 4
attnWindow: 0

inputLayerSize: 256
subsampleFactor: 1
weightReg: 1e-5
actReg: 0.0
trainable: True

stack_kwargs:
  kernel_size: 32
  strides: 4

inputNetwork:
  nInputLayers: 1
  inputLayerSizes: [256]
  trainable: True
  activation: softsign
  dropout: 0.2
